; ============================================================================
; MyGenWashy - ESP32 Controller (Arduino Framework)
;
; Programmablaufsteuerung + Smart Home Integration
; Kommuniziert ueber I2C mit dem Basis-Controller (Arduino Nano / ATTiny3226)
;
; Upload:  pio run -t upload
; Monitor: pio device monitor
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir = src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    Wire
    WiFi
    WebServer
    ESPmDNS
    LittleFS
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0

board_build.filesystem = littlefs

build_flags =
    -DMYGENWASHY_ESP32
    -DCORE_DEBUG_LEVEL=3

upload_protocol = esptool
; Fuer OTA nach erstem Flash:
; upload_protocol = espota
; upload_port = mygenwashy.local
