; ============================================================================
; MyGenWashy - Arduino Nano (ATmega328P) PlatformIO Configuration
; ============================================================================
;
; Upload: einfach über USB (kein UPDI nötig!)
;   pio run -t upload
;
; Bei "Nano Clone" mit CH340:
;   Board bleibt 'nanoatmega328' — Treiber muss installiert sein
; ============================================================================

[platformio]
default_envs = nanoatmega328
src_dir = src

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Bei neueren Nano-Clones mit neuem Bootloader:
; board_upload.speed = 115200

; Bei älteren Original-Nanos (alter Bootloader):
; board = nanoatmega328new   ← falls Upload fehlschlägt, dieses Board probieren

monitor_speed = 115200

build_flags =
    -DMYGENWASHY_NANO

lib_deps =
    Wire
