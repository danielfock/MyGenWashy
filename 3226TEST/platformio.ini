; ============================================================================
; MyGenWashy - ATTiny3226 PlatformIO Configuration
; ============================================================================
;
; Voraussetzungen:
;   1. VS Code + PlatformIO Extension
;   2. pip install pymcuprog
;   3. USB-Serial Adapter (z.B. FTDI, CH340) als UPDI-Programmer
;
; Build:   pio run
; Upload:  pio run -e Upload_UPDI -t upload
; ============================================================================

[platformio]
default_envs = Upload_UPDI
src_dir = src

[env]
platform = atmelmegaavr
board = ATtiny3226
framework = arduino

; Clock frequency 20MHz (internal oscillator)
board_build.f_cpu = 20000000L
board_hardware.oscillator = internal

; megaTinyCore options
; https://github.com/SpenceKonde/megaTinyCore
build_flags =
    -DMILLIS_USE_TIMERB0
build_unflags =

; Serial monitor baud rate
monitor_speed = 57600

; ---- Build-only environment (no upload) ----
[env:Build_Only]
; Inherits everything from [env]
; Use this to just compile: pio run -e Build_Only

; ---- Upload via UPDI (SerialUPDI / pymcuprog) ----
[env:Upload_UPDI]

; Auto-detect upload port, or set manually:
; upload_port = COM3          ; Windows
; upload_port = /dev/ttyUSB0  ; Linux

upload_flags =
    --tool
    uart
    --device
    $BOARD_MCU
    --uart
    $UPLOAD_PORT
    --clk
    $UPLOAD_SPEED

upload_command = pymcuprog write --erase $UPLOAD_FLAGS --filename $SOURCE

; HINWEIS: pymcuprog muss separat installiert werden:
;   pip install pymcuprog
;
; SerialUPDI Verkabelung (USB-Serial Adapter → ATTiny):
;   TX ---[1k Widerstand]---+--- UPDI (Pin 16 / PA0)
;   RX ----------------------+
;   GND ------------------------- GND
;
; Alternativ: Dedicated UPDI programmer (z.B. Microchip SNAP, Atmel-ICE)
